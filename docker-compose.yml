services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: disaster
      POSTGRES_USER: disaster
      POSTGRES_PASSWORD: disaster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster -d disaster"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://disaster:disaster@db:5432/disaster
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python scripts/init_db.py && python scripts/upgrade_family_portal.py && python scripts/create_admin.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1/ws
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
